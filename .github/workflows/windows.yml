name: Windows

on:
  push:
    branches:
      - master
      - 'Stable*'
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
  pull_request:
    paths:
      - '.github/workflows/windows.yml'
      - '.github/actions/**'
      - 'deploy/windows/**'
      - 'src/**'
      - 'test/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'tools/setup/*windows*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read
  id-token: write
  attestations: write
  actions: read

jobs:
  build:
    name: Build ${{ matrix.arch }} ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        build_type: ${{ inputs.build_type && fromJSON(format('["{0}"]', inputs.build_type)) || fromJSON('["Release"]') }}
        variant: [amd64, arm64, arm64-cross]
        include:
          - variant: amd64
            os: windows-2022
            host: windows
            arch: win64_msvc2022_64
            package: QGroundControl-installer-AMD64

          - variant: arm64
            os: windows-11-arm
            host: windows_arm64
            arch: win64_msvc2022_arm64
            package: QGroundControl-installer-ARM64

          # TODO: Remove qt_version override once aqtinstall supports Qt 6.10.1+ for cross-compiled ARM64
          # Workaround: Pin to Qt 6.10.0 until aqtinstall fix is released
          # Tracking: https://github.com/miurahr/aqtinstall/pull/952
          - variant: arm64-cross
            os: windows-2022
            host: windows
            arch: win64_msvc2022_arm64_cross_compiled
            package: QGroundControl-installer-AMD64-ARM64
            qt_version: '6.10.0'

    defaults:
      run:
        shell: cmd

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1
          fetch-tags: true

      - name: Get build config
        id: config
        uses: ./.github/actions/build-config

      - name: Common setup
        uses: ./.github/actions/common

      - name: Install GStreamer
        if: matrix.arch == 'win64_msvc2022_64'
        shell: pwsh
        run: |
          ./tools/setup/install-dependencies-windows.ps1 `
            -GStreamerVersion ${{ steps.config.outputs.gstreamer_windows_version }} `
            -SkipVulkan

      - name: Setup cache
        uses: ./.github/actions/cache
        with:
          host: ${{ matrix.host }}
          target: ${{ matrix.arch }}
          build-type: ${{ matrix.build_type }}
          cpm-modules: ${{ runner.temp }}\build\cpm_modules
          save-cache: ${{ github.event_name != 'pull_request' }}

      - name: Install Qt ${{ matrix.qt_version || steps.config.outputs.qt_version }}
        uses: ./.github/actions/qt-install
        with:
          version: ${{ matrix.qt_version || steps.config.outputs.qt_version }}
          host: ${{ matrix.host }}
          arch: ${{ matrix.arch }}
          modules: ${{ steps.config.outputs.qt_modules }}

      - name: Set up MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ (matrix.arch == 'win64_msvc2022_64' && 'x64') || (matrix.arch == 'win64_msvc2022_arm64' && 'arm64') || 'amd64_arm64' }}

      - name: Configure
        working-directory: ${{ runner.temp }}\build
        run: |
          ${{ env.QT_ROOT_DIR }}\bin\qt-cmake -S ${{ github.workspace }} -B . -G Ninja ^
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} ^
            -DQGC_STABLE_BUILD=${{ (github.ref_type == 'tag' || contains(github.ref, 'Stable')) && 'ON' || 'OFF' }} ^
            -DQGC_ENABLE_GST_VIDEOSTREAMING=${{ matrix.arch == 'win64_msvc2022_64' && 'ON' || 'OFF' }} ^
            -DQT_HOST_PATH=${{ (matrix.arch == 'win64_msvc2022_arm64_cross_compiled') && format('{0}\\..\\msvc2022_64', env.QT_ROOT_DIR) || '' }}

      - name: Build
        working-directory: ${{ runner.temp }}\build
        run: cmake --build . --target all --config ${{ matrix.build_type }} --parallel

      - name: Verify Executable
        if: matrix.build_type == 'Release' && matrix.arch != 'win64_msvc2022_arm64_cross_compiled'
        working-directory: ${{ runner.temp }}\build\${{ matrix.build_type }}
        run: QGroundControl.exe --simple-boot-test

      - name: Create Installer
        working-directory: ${{ runner.temp }}\build
        run: cmake --install . --config ${{ matrix.build_type }}
        
      - name: Create portable Debug package (windeployqt)
        if: matrix.build_type == 'Debug' && matrix.arch == 'win64_msvc2022_64'
        shell: pwsh
        run: |
          $portable = Join-Path $env:RUNNER_TEMP "qgc-portable-debug"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null

          Copy-Item "$env:RUNNER_TEMP\build\Debug\QGroundControl.exe" $portable

          # 把 Qt Debug DLL / plugins / qml 依赖拷贝到同目录
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
            --debug `
            --qmldir "${{ github.workspace }}\src" `
            "$portable\QGroundControl.exe"

          # ---- Copy GStreamer runtime DLLs into portable folder ----
          # GitHub Windows runner 上通常安装在 C:\gstreamer\1.0\msvc_x86_64\bin
          $gstCandidates = @(
            "C:\gstreamer\1.0\msvc_x86_64\bin",
            "C:\gstreamer\1.0\msvc_x86_64\bin\"
          )
      
          $gstBin = $gstCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
      
          if (-not $gstBin) {
            Write-Host "GStreamer bin not found in common locations. Searching for gstbase-1.0-0.dll..."
            $hit = Get-ChildItem -Path C:\ -Filter "gstbase-1.0-0.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($hit) { $gstBin = $hit.Directory.FullName }
          }
      
          if (-not $gstBin) {
            Write-Warning "GStreamer DLLs not found on runner. Portable will be produced but video/RTSP may not work."
            return
          }
      
          Write-Host "Using GStreamer bin: $gstBin"
          
          # 方案 B：复制 bin 目录下所有 DLL（包含 glib-2.0-0.dll、gobject-2.0-0.dll 等）
          Copy-Item (Join-Path $gstBin "*.dll") $portable -Force
      
          # 再补一些常见依赖（有些机器会缺）
          $extra = @(
            "libglib-2.0-0.dll",
            "libgobject-2.0-0.dll",
            "libgio-2.0-0.dll",
            "libgmodule-2.0-0.dll",
            "libgstreamer-1.0-0.dll"
          )
          foreach ($f in $extra) {
            $p = Join-Path $gstBin $f
            if (Test-Path $p) { Copy-Item $p $portable -Force }
          }

          # ---- Ensure QtQuick3D QML module is present (fix qquick3dplugin not found) ----
          $qtQml = Join-Path $env:QT_ROOT_DIR "qml"
          $dstQml = Join-Path $portable "qml"
          
          $qtQuick3DDirs = @(
            "QtQuick3D",
            "QtQuick3D/Helpers",
            "QtQuick3D/Effects",
            "QtQuick3D/ParticleEffects",
            "QtQuick3D/AssetUtils"
          )
          
          foreach ($d in $qtQuick3DDirs) {
            $src = Join-Path $qtQml $d
            if (Test-Path $src) {
              $dst = Join-Path $dstQml $d
              New-Item -ItemType Directory -Force -Path $dst | Out-Null
              Copy-Item $src $dst -Recurse -Force
            } else {
              Write-Warning "Qt QML module missing in Qt install: $src"
            }
          }


      - name: Upload artifact (portable Debug x64)
        if: matrix.build_type == 'Debug' && matrix.arch == 'win64_msvc2022_64'
        uses: actions/upload-artifact@v4
        with:
          name: QGroundControl-win64-portable-Debug
          path: ${{ runner.temp }}\qgc-portable-debug\**
          retention-days: 7
          
      - name: Attest Build Provenance
        if: matrix.build_type == 'Release' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: '${{ runner.temp }}\build\${{ matrix.package }}.exe'

      - name: Upload artifact (installer)
        if: matrix.build_type == 'Release'
        uses: ./.github/actions/upload
        with:
          artifact_name: ${{ matrix.package }}.exe
          package_name: ${{ matrix.package }}
          aws_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_distribution_id: ${{ secrets.AWS_DISTRIBUTION_ID }}
          upload_aws: ${{ matrix.arch == 'win64_msvc2022_arm64_cross_compiled' && 'false' || 'true' }}
          
      - name: Upload artifact (Debug build folder)
        if: matrix.build_type == 'Debug'
        uses: actions/upload-artifact@v4
        with:
          name: QGroundControl-${{ matrix.arch }}-Debug
          path: |
            ${{ runner.temp }}\build\Debug\**
          retention-days: 7
